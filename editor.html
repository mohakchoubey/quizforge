<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a12" />
  <title>Edit PDF — QuizForge</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.ico" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/editor.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body data-page="dashboard">
  <header id="site-header" class="site-header"></header>

  <div class="editor-shell">
    <div class="editor-toolbar">
      <span class="eyebrow">Step 2 of 4</span>
      <span class="editor-meta" id="editor-meta"></span>
      <span class="spacer"></span>
      <button type="button" class="btn btn-secondary" id="rotate-page-btn">Rotate page</button>
      <button type="button" class="btn btn-danger" id="delete-page-btn">Delete page</button>
      <button type="button" class="btn btn-ghost" id="cancel-btn">Cancel</button>
      <button type="button" class="btn btn-primary" id="save-btn">Save & continue</button>
    </div>

    <div class="alert container-narrow mt-lg" data-form-alert id="editor-alert" style="margin-inline:auto;"></div>

    <div class="editor-empty hidden" id="editor-empty">
      <p>No PDF is ready to edit yet.</p>
      <a href="upload.html" class="btn btn-primary mt-lg">Upload a PDF</a>
    </div>

    <div class="editor-layout" id="editor-layout">
      <div class="thumbnail-rail" id="thumbnail-rail"></div>
      <div class="canvas-stage">
        <div class="canvas-frame">
          <canvas id="pdf-render-canvas"></canvas>
        </div>
        <div class="canvas-controls">
          <button type="button" id="prev-btn">← Previous</button>
          <span><span id="page-num">1</span></span>
          <button type="button" id="next-btn">Next →</button>
          <span id="page-count" class="mono"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/navbar.js"></script>
  <script type="module" src="js/editor.js"></script>
</body>
</html>
