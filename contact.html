<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a12" />
  <title>Contact — QuizForge</title>
  <meta name="description" content="Get in touch about QuizForge — questions, bug reports, or partnership requests." />
  <link rel="icon" href="favicon.ico" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/navbar.css" />
</head>
<body data-page="contact">
  <header id="site-header" class="site-header"></header>

  <main>
    <section class="page-head container-narrow">
      <span class="eyebrow">Contact</span>
      <h1>Get in touch</h1>
      <p class="mx-auto">
        Bug reports, questions, partnership ideas — send it over and you'll hear back by email.
      </p>
    </section>

    <section class="container-narrow" style="padding-top: 0;">
      <div class="card">
        <div class="alert" data-form-alert></div>

        <!-- Replace YOUR_FORM_ID with the Formspree endpoint for this form -->
        <form class="stack" action="https://formspree.io/f/YOUR_FORM_ID" method="POST" data-formspree novalidate>
          <div class="field">
            <label for="contact-name">Name</label>
            <input id="contact-name" name="name" type="text" placeholder="Your name" required />
          </div>

          <div class="field">
            <label for="contact-email">Email</label>
            <input id="contact-email" name="email" type="email" placeholder="you@example.com" required />
          </div>

          <div class="field">
            <label for="contact-subject">Subject</label>
            <select id="contact-subject" name="subject">
              <option value="General question">General question</option>
              <option value="Bug report">Bug report</option>
              <option value="Feature request">Feature request</option>
              <option value="Partnership / other">Partnership / other</option>
            </select>
          </div>

          <div class="field">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" rows="6" placeholder="What's going on?" required></textarea>
          </div>

          <button type="submit" class="btn btn-primary btn-block">
            <span class="spinner"></span>
            <span class="btn-label">Send message</span>
          </button>
        </form>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="footer"></footer>

  <script src="js/main.js"></script>
  <script src="js/navbar.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
